<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vinix — Administração</title><style>body{font-family:Arial,sans-serif;background:#080908;color:#fff;margin:0}.wrap{max-width:1100px;margin:auto;padding:30px}.box{background:#131613;border:1px solid #313731;border-radius:16px;padding:24px;margin:20px 0}h1{color:#b7ff00}input,select{padding:12px;border-radius:8px;border:1px solid #454a45;background:#090b09;color:#fff;width:100%;box-sizing:border-box}button{padding:11px 16px;border:0;border-radius:999px;background:#b7ff00;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quote{border-top:1px solid #343934;padding:18px 0}.muted{color:#aeb4ad}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>VINIX — Painel administrativo</h1><div id="login" class="box"><h2>Entrar</h2><form id="loginForm"><div class="grid"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required></div><br><button>Entrar</button></form><p id="loginMsg" class="muted"></p></div><div id="app" style="display:none"><div class="box"><button id="logout">Sair</button> <span id="who" class="muted"></span></div><div id="quotes" class="box"></div></div></div><script>const $=s=>document.querySelector(s);async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro');return d}async function load(){try{const me=await api('/api/admin/me');$('#login').style.display='none';$('#app').style.display='block';$('#who').textContent=me.email;const qs=await api('/api/admin/orcamentos');$('#quotes').innerHTML='<h2>Solicitações de orçamento ('+qs.length+')</h2>'+qs.map(q=>`<div class="quote"><b>#${q.id} — ${q.name}</b><div class="muted">${q.email} · ${q.phone} · ${q.service}</div><p>${q.description}</p>${q.attachment_path?`<a href="${q.attachment_path}" target="_blank">Ver anexo</a>`:''}<br><br><select data-id="${q.id}"><option ${q.status==='Pendente'?'selected':''}>Pendente</option><option ${q.status==='Em análise'?'selected':''}>Em análise</option><option ${q.status==='Orçamento enviado'?'selected':''}>Orçamento enviado</option><option ${q.status==='Concluído'?'selected':''}>Concluído</option></select></div>`).join('');document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{await api('/api/admin/orcamentos/'+s.dataset.id,{method:'PATCH',body:JSON.stringify({status:s.value})})})}catch(e){}}$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});load()}catch(e){$('#loginMsg').textContent=e.message}};$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};load();</script></body></html>
