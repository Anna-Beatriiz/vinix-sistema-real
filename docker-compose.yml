
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vinix
      POSTGRES_USER: vinix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://vinix:${POSTGRES_PASSWORD}@db:5432/vinix
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports: ["3000:3000"]
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:

